<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="알림시험">
<title>알림 시험</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
  :root { --bg: #FAF7F2; --surface: #FFFFFF; --surface-2: #F1EBE2; --text: #1E1A16; --text-2: #5C544A; --line: #E3DACD; --accent: #C2410C; --accent-soft: #FFEADB; --accent-ink: #9A3412; --ok: #15803D; --bad: #B91C1C; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15120F; --surface: #221E1A; --surface-2: #2E2924; --text: #F4EFE8; --text-2: #B9AFA2; --line: #3A332C; --accent: #FB8A4C; --accent-soft: #3A2417; --accent-ink: #FDBA8C; --ok: #4ADE80; --bad: #F87171; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; background: var(--bg); color: var(--text);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px)); word-break: keep-all; line-height: 1.5; }
  h1 { font-size: 28px; font-weight: 800; }
  .sub { color: var(--text-2); font-size: 17px; margin-top: 4px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 8px 16px; margin-top: 16px; }
  .st { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 17px; }
  .st + .st { border-top: 1px solid var(--line); }
  .st b { text-align: right; }
  .yes { color: var(--ok); } .no { color: var(--bad); }
  .opened { margin-top: 16px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 16px; padding: 14px 16px; font-size: 18px; font-weight: 800; }
  .btn { display: block; width: 100%; min-height: 60px; border: 0; border-radius: 16px; font: inherit; font-size: 20px; font-weight: 800; margin-top: 12px; background: var(--surface-2); color: var(--text); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; }
  .hint { font-size: 15px; color: var(--text-2); margin-top: 8px; }
  #log { margin-top: 20px; font-size: 14px; color: var(--text-2); font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>알림 시험 (0단계)</h1>
<p class="sub">말씀 보석 100 알림이 이 기기에 오는지 확인해요. 아이들 앱과는 따로예요.</p>
<div id="opened" class="opened" hidden></div>
<div class="card" id="status"></div>
<button class="btn primary" id="prepare" type="button">알림 허용하고 준비하기</button>
<button class="btn" id="now" type="button" disabled>지금 보내기</button>
<button class="btn" id="later" type="button" disabled>1분 뒤 보내기</button>
<p class="hint">“1분 뒤 보내기”를 누른 다음 바로 앱을 닫고 화면을 꺼 두세요. 알림이 오면 눌러서 이 앱이 열리는지 봐요.</p>
<div id="log"></div>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-messaging-compat.js"></script>
<script type="module" src="push0.js"></script>
</body>
</html>
